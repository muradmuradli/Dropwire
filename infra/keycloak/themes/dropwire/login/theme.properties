# Extends Keycloak's default login theme (keycloak.v2) rather than reimplementing every page
# (registration, OTP, WebAuthn, "forgot password", ...) from scratch. We only override a couple of
# CSS rules to get a plain white, unbranded background — a real design gets dropped in here later.
parent=keycloak.v2
import=common/keycloak

# NOTE: this list replaces the parent's `styles` list, it does not append to it — keycloak.v2's own
# stylesheet must be listed first or the page loses its PatternFly layout/spacing entirely.
styles=css/styles.css css/dropwire.css
